<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Presby Ticket{% endblock %}</title>
  <script>try { if (localStorage.getItem('presbyticket-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Presby Ticket home"><span class="brand-mark">P<span>.</span></span><span>presby<span class="brand-light">ticket</span></span></a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav aria-label="Main navigation"><a class="nav-link {% if not request.url.path.startswith('/reports') and not request.url.path.startswith('/archive') and not request.url.path.startswith('/recurring') %}active{% endif %}" href="/"><span class="nav-icon">▦</span> Board <span class="nav-arrow">↗</span></a><a class="nav-link {% if request.url.path.startswith('/recurring') %}active{% endif %}" href="/recurring"><span class="nav-icon">↻</span> Recurring <span class="nav-arrow">↗</span></a><a class="nav-link {% if request.url.path.startswith('/reports') %}active{% endif %}" href="/reports"><span class="nav-icon">▤</span> Reports <span class="nav-arrow">↗</span></a><a class="nav-link {% if request.url.path.startswith('/archive') %}active{% endif %}" href="/archive"><span class="nav-icon">▥</span> Archive <span class="nav-arrow">↗</span></a></nav>
      <div class="sidebar-bottom"><div class="side-tip"><span class="tip-icon">✦</span><strong>Keep things moving.</strong><p>Capture the work, choose a priority, and move it across the board.</p></div><span class="sidebar-footer">Simple work, clearly tracked.</span></div>
    </aside>
    <main class="main">{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
